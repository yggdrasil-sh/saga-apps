# Baut alle Apps als versionierte Downloads und veroeffentlicht sie als GitHub-Release.
#   - macOS:   Saga-<v>-macOS.dmg            (Developer ID, von Apple beglaubigt)
#   - Linux:   saga-<v>-1.noarch.rpm, saga-<v>-<arch>.flatpak
#   - Android: Saga-<v>.apk                  (signiert)
# Ausloeser: Aenderung an VERSION auf main (tools/set-version.sh x.y.z) -> Tag v<x.y.z> + Release.
# Von Hand (Actions -> Release -> Run workflow): nur bauen (Downloads als Workflow-Artefakte)
# oder mit "release" auch veroeffentlichen. Gibt es den Tag schon, wird nur gebaut.
#
# Benoetigte Secrets (Werte liegen im Vaultwarden des Projekts):
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_TEAM_ID,
#            ASC_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Fehlen sie, wird beim reinen Bauen uebersprungen (macOS) bzw. unsigniert gebaut (Android);
# ein Release bricht dann ab.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      release:
        description: "Auch als GitHub-Release veroeffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version pruefen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          WANT: ${{ github.event_name == 'push' || inputs.release == true }}
        run: |
          V=$(sh tools/set-version.sh --check)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "::notice::v$V ist schon veroeffentlicht - es wird nur gebaut"
            R=false
          else
            R=$WANT
          fi
          echo "release=$R" >> "$GITHUB_OUTPUT"
          echo "Saga-Apps $V, Release: $R"

  android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Das Android-SDK ist auf den Ubuntu-Runnern vorinstalliert (ANDROID_HOME); nur fehlende Teile nachladen
      - name: Android-SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-37" "build-tools;36.0.0" >/dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -6
      - uses: gradle/actions/setup-gradle@v4
      - name: Signierschluessel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -z "$KS" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; fi
            echo "::warning::Kein Signierschluessel - die APK bleibt unsigniert"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/saga.jks"
          echo "SAGA_KEYSTORE_FILE=$RUNNER_TEMP/saga.jks" >> "$GITHUB_ENV"
      - name: Bauen und testen
        working-directory: android
        env:
          SAGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAGA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease testDebugUnitTest
      - name: Signatur pruefen
        if: env.SAGA_KEYSTORE_FILE != ''
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" verify --print-certs android/dist/Saga-*.apk | grep -E "certificate (DN|SHA-256)"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/dist/Saga-*.apk
          if-no-files-found: error
      - name: Aufraeumen
        if: always()
        run: rm -f "$RUNNER_TEMP/saga.jks"

  rpm:
    name: Linux (RPM)
    needs: version
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - run: dnf install -y rpm-build python3 git tar
      - uses: actions/checkout@v5
      - run: HK_RELEASE=1 sh linux/build-rpm.sh
      - run: rpm -qip linux/dist/saga-*.noarch.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: linux/dist/saga-*.noarch.rpm
          if-no-files-found: error

  flatpak:
    name: Linux (Flatpak ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # aarch64 laeuft auf einem ARM-Runner; faellt es aus, erscheint das Release ohne diese Datei
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    steps:
      - uses: actions/checkout@v5
      - run: sh linux/flatpak/build-flatpak.sh
        env:
          HK_FLATPAK_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: linux/dist/saga-*.flatpak
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Zertifikat und API-Schluessel
        id: keys
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12PW: ${{ secrets.MAC_CERT_PASSWORD }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -z "$P12" ] || [ -z "$P8" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::Secrets MAC_CERT_P12_BASE64/ASC_KEY_P8_BASE64 fehlen"; exit 1; fi
            echo "::warning::Kein Developer-ID-Zertifikat - die DMG wird nicht gebaut"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # eigener, temporaerer Schluesselbund nur fuer diesen Lauf
          KC="$RUNNER_TEMP/saga.keychain-db"
          KCPW=$(openssl rand -hex 24)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12PW" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Zwischenzertifikat von Apple (Developer ID G2), falls das Runner-Image es nicht mitbringt
          curl -fsSL -o "$RUNNER_TEMP/g2.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/g2.cer" -k "$KC" >/dev/null 2>&1 || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "SAGA_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: DMG bauen und beglaubigen
        if: steps.keys.outputs.skip != '1'
        env:
          SAGA_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: sh ios/build-dmg.sh
      - if: steps.keys.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ios/dist/Saga-*-macOS.dmg
          if-no-files-found: error
      - name: Aufraeumen
        if: always()
        run: |
          [ -z "${SAGA_KEYCHAIN:-}" ] || security delete-keychain "$SAGA_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  release:
    name: Veroeffentlichen
    needs: [version, android, rpm, flatpak, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release-Notizen
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          {
            awk -v v="[$V]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md
            echo
            echo "### Downloads"
            echo
            echo "| System | Datei |"
            echo "|---|---|"
            for f in dist/*; do
              n=$(basename "$f")
              case "$n" in
                *.dmg) s="macOS 26 oder neuer" ;;
                *.apk) s="Android 8 oder neuer" ;;
                *.rpm) s="Fedora, AlmaLinux/RHEL 10 (mit EPEL)" ;;
                *x86_64.flatpak) s="Linux, Flatpak (x86_64)" ;;
                *aarch64.flatpak) s="Linux, Flatpak (ARM64)" ;;
                *) s="" ;;
              esac
              echo "| $s | \`$n\` |"
            done
            echo
            echo "Prüfsummen (SHA-256) stehen in \`SHA256SUMS\`."
          } > notes.md
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          cat notes.md
      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "Saga-Apps $V" --notes-file notes.md
