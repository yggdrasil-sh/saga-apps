# Baut alle Apps als versionierte Downloads und veroeffentlicht sie als GitHub-Release.
#   - macOS:   Saga-<v>-macOS.dmg            (Developer ID, von Apple beglaubigt)
#   - Linux:   saga-<v>-1.noarch.rpm, saga-<v>-<arch>.flatpak
#   - Android: Saga-<v>.apk                  (signiert)
#   Vorabversionen: <v> = <Version>-rc.<N> (RPM: saga-<Version>-0.rc<N>.noarch.rpm)
# Ausloeser: Aenderung an VERSION auf main (tools/set-version.sh x.y.z) -> Tag v<x.y.z> + Release.
# Ebenso ein Push auf main, dessen Commit-Nachricht "[release]" enthaelt (z. B. fuer eine Version ohne Sprung).
# Jeder Push auf testing baut alle Pakete und ersetzt die Vorabversion "v<Version>-rc.<N>" (Release Candidate,
# Pre-release, nie "Latest"; N = Commits seit dem letzten Release-Tag).
# Angezeigte Version: nur das offizielle Release zeigt "<Version>", alle anderen Builds "<Version>-rc.<N>"
# (tools/version-label.sh; der Job "version" legt das Label einmal fest, alle Bau-Jobs uebernehmen es).
# Von Hand (Actions -> Release -> Run workflow): nur bauen (Downloads als Workflow-Artefakte)
# oder mit "release" auch veroeffentlichen. Gibt es den Tag schon, wird nur gebaut.
#
# Benoetigte Secrets (Werte liegen im Vaultwarden des Projekts):
#   macOS:   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_TEAM_ID,
#            ASC_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Fehlen sie, wird beim reinen Bauen uebersprungen (macOS) bzw. unsigniert gebaut (Android);
# ein Release bricht dann ab.
# Optional: SPARKLE_ED_PRIVATE_KEY (Selbst-Update der Mac-App ueber Sparkle; Export von Sparkles generate_keys -x).
#   Mit ihm traegt die DMG Appcast-Adresse und oeffentlichen Schluessel ein, und jede Veroeffentlichung ersetzt den
#   signierten Appcast im Zweig "appcast" (appcast.xml = Releases, appcast-rc.xml = Vorabversionen).
#   Ohne ihn: DMG ohne Selbst-Update, kein Appcast, nur ein Hinweis.
name: Release

on:
  push:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      release:
        description: "Auch als GitHub-Release veroeffentlichen"
        type: boolean
        default: false
      mac_runner:
        description: "macOS-Build auf: hosted (GitHub) oder self (eigener Mac mit Label saga-mac)"
        type: choice
        options: [hosted, self]
        default: hosted

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Probelaeufe auf testing: aelteren Lauf abbrechen, wenn ein neuer Push kommt
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    name: Version pruefen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Tags + Historie fuer das Versionslabel (Commits seit dem letzten Release-Tag)
      - id: v
        env:
          WANT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release == true }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          V=$(sh tools/set-version.sh --check)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Push auf main loest nur aus, wenn sich VERSION geaendert hat oder die Commit-Nachricht [release] enthaelt
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && ! printf '%s' "$MSG" | grep -qF '[release]'; then
            # volle Historie ist da (fetch-depth 0); nicht mit --depth nachladen, das machte den Clone flach (Label rc.0)
            git cat-file -e "$BEFORE" 2>/dev/null || git fetch -q origin "$BEFORE" 2>/dev/null || true
            if git cat-file -e "$BEFORE" 2>/dev/null && git diff --quiet "$BEFORE" HEAD -- VERSION; then
              echo "::notice::VERSION unveraendert - es wird nur gebaut"
              WANT=false
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "::notice::v$V ist schon veroeffentlicht - es wird nur gebaut"
            R=false
          else
            R=$WANT
          fi
          echo "release=$R" >> "$GITHUB_OUTPUT"
          # Angezeigte Version: im Release ohne Zusatz, sonst z. B. 2.2.0-rc.3
          if [ "$R" = true ]; then L=$(SAGA_RELEASE=1 sh tools/version-label.sh); else L=$(sh tools/version-label.sh); fi
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "Saga-Apps $V, Release: $R, angezeigt: $L"

  android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Das Android-SDK ist auf den Ubuntu-Runnern vorinstalliert (ANDROID_HOME); nur fehlende Teile nachladen
      - name: Android-SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          # compileSdk 37 heisst im SDK "android-37.0"
          if ! "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1; then
            tail -15 "$RUNNER_TEMP/sdk.log" | while IFS= read -r l; do echo "::error::sdkmanager: $l"; done
            exit 1
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -6
      - uses: gradle/actions/setup-gradle@v4
      - name: Signierschluessel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -z "$KS" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; fi
            echo "::warning::Kein Signierschluessel - die APK bleibt unsigniert"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/saga.jks"
          echo "SAGA_KEYSTORE_FILE=$RUNNER_TEMP/saga.jks" >> "$GITHUB_ENV"
      - name: Bauen und testen
        working-directory: android
        env:
          SAGA_VERSION_LABEL: ${{ needs.version.outputs.label }}
          SAGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAGA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # bei Fehlern die letzten Zeilen als Annotation ausgeben (Logs sind sonst nur fuer Admins lesbar)
          if ! ./gradlew --no-daemon assembleRelease testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -E "FAILURE|What went wrong|e: |error:|> " "$RUNNER_TEMP/gradle.log" | head -20 | while IFS= read -r l; do echo "::error::gradle: $l"; done
            exit 1
          fi
      - name: Signatur pruefen
        if: env.SAGA_KEYSTORE_FILE != ''
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$AS" verify --print-certs android/dist/Saga-*.apk | grep -E "certificate (DN|SHA-256)"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/dist/Saga-*.apk
          if-no-files-found: error
      - name: Aufraeumen
        if: always()
        run: rm -f "$RUNNER_TEMP/saga.jks"

  rpm:
    name: Linux (RPM)
    needs: version
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - run: dnf install -y rpm-build python3 gettext git tar
      - uses: actions/checkout@v5
      - run: sh linux/build-rpm.sh
        env:
          SAGA_VERSION_LABEL: ${{ needs.version.outputs.label }}   # Release -> saga-x.y.z-1, sonst saga-x.y.z-0.rcN
      - run: rpm -qip linux/dist/saga-*.noarch.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: linux/dist/saga-*.noarch.rpm
          if-no-files-found: error

  flatpak:
    name: Linux (Flatpak ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # aarch64 laeuft auf einem ARM-Runner; faellt es aus, erscheint das Release ohne diese Datei
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    steps:
      - uses: actions/checkout@v5
      - run: sh linux/flatpak/build-flatpak.sh
        env:
          HK_FLATPAK_ARCH: ${{ matrix.arch }}
          SAGA_VERSION_LABEL: ${{ needs.version.outputs.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: linux/dist/saga-*.flatpak
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    needs: version
    # Eigener Mac nur von Hand (Run workflow, mac_runner=self); Pushes bauen immer auf GitHub-Runnern
    runs-on: ${{ inputs.mac_runner == 'self' && fromJSON('["self-hosted","saga-mac"]') || 'macos-26' }}
    steps:
      - uses: actions/checkout@v5
      # Xcode-Auswahl nur auf GitHub-Runnern; auf dem eigenen Mac bleibt das System unveraendert
      - if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Zertifikat und API-Schluessel
        id: keys
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12PW: ${{ secrets.MAC_CERT_PASSWORD }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [ -z "$P12" ] || [ -z "$P8" ]; then
            if [ "$RELEASE" = true ]; then echo "::error::Secrets MAC_CERT_P12_BASE64/ASC_KEY_P8_BASE64 fehlen"; exit 1; fi
            echo "::warning::Kein Developer-ID-Zertifikat - die DMG wird nicht gebaut"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # eigener, temporaerer Schluesselbund nur fuer diesen Lauf
          KC="$RUNNER_TEMP/saga.keychain-db"
          KCPW=$(openssl rand -hex 24)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12PW" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Zwischenzertifikat von Apple (Developer ID G2), falls das Runner-Image es nicht mitbringt
          curl -fsSL -o "$RUNNER_TEMP/g2.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/g2.cer" -k "$KC" >/dev/null 2>&1 || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "SAGA_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # Selbst-Update (Sparkle): oeffentlichen Schluessel aus dem privaten ableiten; ohne Secret bleibt es aus
      - name: Sparkle-Schluessel
        if: steps.keys.outputs.skip != '1'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_KEY" ]; then
            echo "::notice::Kein Secret SPARKLE_ED_PRIVATE_KEY - die DMG kommt ohne Selbst-Update, es gibt keinen Appcast"
            exit 0
          fi
          if ! PUB=$(printf '%s' "$SPARKLE_KEY" | swift tools/sparkle-pubkey.swift); then
            echo "::error::SPARKLE_ED_PRIVATE_KEY ist kein Sparkle-Schluessel (Export von generate_keys -x erwartet)"
            exit 1
          fi
          echo "SAGA_SPARKLE_PUBLIC_KEY=$PUB" >> "$GITHUB_ENV"
          echo "Oeffentlicher Sparkle-Schluessel (SUPublicEDKey): $PUB"
      - name: DMG bauen und beglaubigen
        if: steps.keys.outputs.skip != '1'
        env:
          SAGA_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          SAGA_VERSION_LABEL: ${{ needs.version.outputs.label }}
          SAGA_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -o pipefail
          sh ios/build-dmg.sh 2>&1 | tee "$RUNNER_TEMP/dmg.log"
      # Appcast (eine Datei je Kanal, ein Eintrag): DMG und Appcast mit EdDSA signieren und beides gleich pruefen.
      # Veroeffentlicht wird er erst nach dem Release (Jobs release/testing, tools/publish-appcast.sh).
      - name: Appcast (Sparkle)
        if: steps.keys.outputs.skip != '1' && env.SAGA_SPARKLE_PUBLIC_KEY != ''
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          . ios/dist/sparkle-info.env
          SU=ios/dist/sparkle-bin/sign_update
          DMG=ios/dist/Saga-$SAGA_LABEL-macOS.dmg
          SIG=$(printf '%s' "$SPARKLE_KEY" | "$SU" --ed-key-file - -p "$DMG")
          printf '%s' "$SPARKLE_KEY" | "$SU" --verify --ed-key-file - "$DMG" "$SIG"
          F=$(python3 tools/appcast.py --label "$SAGA_LABEL" --build "$SAGA_BUILD" --dmg "$DMG" --signature "$SIG" \
                --repo "$GITHUB_REPOSITORY" --changelog CHANGELOG.md --out-dir ios/dist/appcast)
          printf '%s' "$SPARKLE_KEY" | "$SU" --ed-key-file - "$F"
          printf '%s' "$SPARKLE_KEY" | "$SU" --verify --ed-key-file - "$F"
          xmllint --noout "$F"
          echo "Appcast $F fuer $SAGA_FEED:"; cat "$F"
      - name: Fehler als Hinweise (lesbar ueber die API, ohne Log-Download)
        if: failure()
        shell: bash
        run: grep -E "error:|FEHLER|abgelehnt" "$RUNNER_TEMP/dmg.log" | sort -u | head -20 | sed 's/^/::error::/' || true
      - if: steps.keys.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ios/dist/Saga-*-macOS.dmg
          if-no-files-found: error
      - if: steps.keys.outputs.skip != '1' && env.SAGA_SPARKLE_PUBLIC_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-appcast
          path: ios/dist/appcast/appcast*.xml
          if-no-files-found: error
      - name: Aufraeumen
        if: always()
        run: |
          [ -z "${SAGA_KEYCHAIN:-}" ] || security delete-keychain "$SAGA_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  release:
    name: Veroeffentlichen
    needs: [version, android, rpm, flatpak, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release-Notizen
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p appcast-out && find dist -maxdepth 1 -name 'appcast*.xml' -exec mv {} appcast-out/ \;   # kein Release-Asset
          ls -l dist
          # Abschnitt "## [x.y.z] – Datum" aus CHANGELOG.md; fehlt er, lieber abbrechen als ohne Notizen veroeffentlichen
          N=$(awk -v v="[$V]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md)
          # @Wort nicht als GitHub-Erwaehnung verlinken (sonst landen fremde Konten unter "Contributors")
          N=$(printf '%s\n' "$N" | python3 tools/notes-entschaerfen.py)
          if [ -z "$(printf '%s' "$N" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md hat keinen (oder einen leeren) Abschnitt [$V]"
            exit 1
          fi
          {
            printf '%s\n' "$N"
            echo
            echo "### Downloads"
            echo
            echo "| System | Datei |"
            echo "|---|---|"
            for f in dist/*; do
              n=$(basename "$f")
              case "$n" in
                *.dmg) s="macOS 26 oder neuer" ;;
                *.apk) s="Android 8 oder neuer" ;;
                *.rpm) s="Fedora, AlmaLinux/RHEL 10 (mit EPEL)" ;;
                *x86_64.flatpak) s="Linux, Flatpak (x86_64)" ;;
                *aarch64.flatpak) s="Linux, Flatpak (ARM64)" ;;
                *) s="" ;;
              esac
              echo "| $s | \`$n\` |"
            done
            echo
            echo "Prüfsummen (SHA-256) stehen in \`SHA256SUMS\`."
          } > notes.md
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          cat notes.md
      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "Saga-Apps $V" --notes-file notes.md
      - name: Appcast fuer das Selbst-Update (Mac)
        env:
          V: ${{ needs.version.outputs.version }}
        run: sh tools/publish-appcast.sh appcast-out appcast.xml "$V"

  # Jeder Push auf testing aktualisiert EINE Vorabversion "v<Version>-rc.<N>" (Release Candidate, Pre-release, nie "Latest").
  # Aeltere Vorabversionen (*-rc.N, *+dev.N und die frueheren *-testing) werden dabei entfernt; echte Releases bleiben.
  testing:
    name: Vorabversion (Release Candidate)
    needs: [version, android, rpm, flatpak, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing' && !cancelled() && needs.android.result == 'success' && needs.rpm.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: testing-prerelease
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notizen
        env:
          L: ${{ needs.version.outputs.label }}
        run: |
          mkdir -p appcast-out && find dist -maxdepth 1 -name 'appcast*.xml' -exec mv {} appcast-out/ \;   # kein Release-Asset
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS)
          # Abschnitt [Unveröffentlicht]; direkt nach einem Release ist er leer -> kurzer Satz statt leerer Notizen
          N=$(awk '/^## \[/ { p = index($0, "[Unveröffentlicht]") > 0; next } p' CHANGELOG.md)
          N=$(printf '%s\n' "$N" | python3 tools/notes-entschaerfen.py)
          if [ -z "$(printf '%s' "$N" | tr -d '[:space:]')" ]; then
            N="Noch keine Änderungen seit der letzten Version."
          fi
          {
            echo "**Testversion $L – nicht für den Alltag gedacht.** Stand von \`testing\`, Commit ${GITHUB_SHA::7}, gebaut $(date -u '+%Y-%m-%d %H:%M') UTC."
            echo "Wird bei jeder Änderung auf \`testing\` ersetzt. Stabile Version: siehe „Latest“."
            echo
            printf '%s\n' "$N"
            echo
            echo "Prüfsummen (SHA-256) stehen in \`SHA256SUMS\`."
          } > notes.md
      - name: Vorabversion ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          L: ${{ needs.version.outputs.label }}
        run: |
          # Sicherung: eine Vorabversion traegt immer -rc.N - nie einen echten Release-Tag v<x.y.z> anlegen/belegen
          # (z. B. steht testing genau auf dem Release-Commit: Label = x.y.z -> keine Vorabversion, nichts aufraeumen)
          if ! printf '%s' "$L" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::notice::Label '$L' ist keine Vorabversion (x.y.z-rc.N) - es wird keine Vorabversion angelegt"
            exit 0
          fi
          TITLE="Saga-Apps $L (Release Candidate)"
          # nur Vorabversionen dieses Workflows (v*-rc.N, v*+dev.N, frueher v*-testing) - nie echte Releases
          for t in $(gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
                     | grep -E -- '^v[0-9]+\.[0-9]+\.[0-9]+(-testing|-rc\.[0-9]+|\+dev\.[0-9]+)$' || true); do
            gh release delete "$t" --cleanup-tag --yes
          done
          # verwaiste Tags alter Vorabversionen (Release schon geloescht) und den eigenen Tag entfernen -
          # Tags, an denen noch ein (von Hand angelegtes) Release haengt, bleiben
          REL=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          for t in $(git ls-remote --tags --refs origin | sed -n 's|.*refs/tags/||p' \
                     | grep -E -- '^v[0-9]+\.[0-9]+\.[0-9]+(-testing|-rc\.[0-9]+|\+dev\.[0-9]+)$' || true); do
            if printf '%s\n' "$REL" | grep -qxF -- "$t"; then continue; fi
            git push -q origin ":refs/tags/$t" 2>/dev/null || true
          done
          gh release create "v$L" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$TITLE" --notes-file notes.md
      - name: Appcast fuer das Selbst-Update (Mac)
        env:
          L: ${{ needs.version.outputs.label }}
        run: |
          # wie oben: nur fuer echte Vorabversionen (x.y.z-rc.N)
          printf '%s' "$L" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' || exit 0
          sh tools/publish-appcast.sh appcast-out appcast-rc.xml "$L"
