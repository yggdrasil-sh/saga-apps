# Flatpak-Manifest fuer Saga (GTK4 + libadwaita, Python). Bauen: linux/flatpak/build-flatpak.sh
app-id: io.github.yggdrasil_sh.Saga
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: saga
finish-args:
  # Saga-Server (selbst gehostet) und Anmeldung im Browser
  - --share=network
  # Anzeige: Wayland, X11 nur als Rueckfall; IPC fuer X11 (MIT-SHM)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU-Beschleunigung fuer GTK4
  - --device=dri
  # Geraete-Schluessel: libsecret nimmt im Flatpak das Secret-Portal (verschluesselte Datei in der App-Sandbox),
  # sobald es eins gibt (GNOME, KDE mit Portal) - dann wird org.freedesktop.secrets gar nicht benutzt.
  # Ohne Portal (z. B. Xfce, aeltere KDE) spricht libsecret direkt mit dem Schluesselbund: bisherige Installationen
  # haben ihren Schluessel dort abgelegt und wuerden ohne diese Freigabe abgemeldet (neue landeten sonst in einer
  # Ersatzdatei). Darum bleibt die Freigabe, obwohl sie dort Zugriff auf den ganzen Schluesselbund gibt.
  - --talk-name=org.freedesktop.secrets
  # Kein Dateisystem-Zugriff: Anhaenge speichern, Bild waehlen, Anhaengen und Exportieren laufen ueber Gtk.FileDialog (Portal)
# Uebersetzungen bleiben in der App (/app/share/locale): ein Locale-Erweiterungspaket fehlte sonst im Einzeldatei-Bundle
separate-locales: false
cleanup:
  - '*.pyi'
modules:
  # Pillow (Bilder umwandeln/skalieren) als fertiges Wheel von PyPI
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps pillow
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/f7/62/de5bdd77d935331f4f802edc11e4d82950f642caad6cb2f949837b8560e2/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/1f/01/e18aff37cb0b4aac47ac90f016d347a49aca667ef97f190b06ac2aabc928/pillow-12.3.0-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: f7401aebd7f581d7f83a439d87d474999317ee099218e5ad25d125290990ba65

  - name: saga
    buildsystem: simple
    build-commands:
      - install -d ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf
      - cp -a hlidskjalf/*.py hlidskjalf/style.css ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf/
      # Testmodus (HK_TEST) gehoert nicht ins Paket
      - rm -f ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf/testing.py
      - python3 -m compileall -q -d /app/share/hlidskjalf/hlidskjalf ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf
      # Uebersetzungen: po/*.po -> /app/share/locale/<sprache>/LC_MESSAGES/io.github.yggdrasil_sh.Saga.mo (msgfmt aus dem SDK)
      - sh po/build-mo.sh ${FLATPAK_DEST}/share/locale
      - install -Dm755 flatpak/saga ${FLATPAK_DEST}/bin/saga
      # Befehl heisst im Flatpak "saga" (im RPM "hlidskjalf")
      - sed -e 's/^Exec=hlidskjalf/Exec=saga/' data/${FLATPAK_ID}.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # GNOME-Suche: D-Bus-Dienst (Exec wird beim Export auf "flatpak run" umgeschrieben)
      - install -Dm644 data/${FLATPAK_ID}.SearchProvider.ini ${FLATPAK_DEST}/share/gnome-shell/search-providers/${FLATPAK_ID}.SearchProvider.ini
      - sed -e 's|^Exec=.*|Exec=/app/bin/saga --search-provider|' data/${FLATPAK_ID}.SearchProvider.service > ${FLATPAK_ID}.SearchProvider.service
      - install -Dm644 ${FLATPAK_ID}.SearchProvider.service ${FLATPAK_DEST}/share/dbus-1/services/${FLATPAK_ID}.SearchProvider.service
    sources:
      - type: dir
        path: ..
        skip:
          - dist
          - tests
          - .flatpak-builder
          - build-rpm.sh
          - hlidskjalf.spec
          - README.md
