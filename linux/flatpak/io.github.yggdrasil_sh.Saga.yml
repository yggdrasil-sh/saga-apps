# Flatpak-Manifest fuer Saga (GTK4 + libadwaita, Python). Bauen: linux/flatpak/build-flatpak.sh
app-id: io.github.yggdrasil_sh.Saga
# Die GNOME-Laufzeit enthaelt die Farb-Emoji-Schrift (Noto Color Emoji, /usr/share/fonts/noto-emoji) - Seitensymbole
# und Hinweise sind Emoji; build-flatpak.sh prueft das bei jedem Bau
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: saga
finish-args:
  # Saga-Server (selbst gehostet) und Anmeldung im Browser
  - --share=network
  # Anzeige: Wayland, X11 nur als Rueckfall; IPC fuer X11 (MIT-SHM)
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPU-Beschleunigung fuer GTK4
  - --device=dri
  # Geraete-Schluessel: libsecret nimmt im Flatpak das Secret-Portal (verschluesselte Datei in der App-Sandbox),
  # sobald es eins gibt (GNOME, KDE mit Portal) - dann wird org.freedesktop.secrets gar nicht benutzt.
  # Ohne Portal (z. B. Xfce, aeltere KDE) spricht libsecret direkt mit dem Schluesselbund: bisherige Installationen
  # haben ihren Schluessel dort abgelegt und wuerden ohne diese Freigabe abgemeldet (neue landeten sonst in einer
  # Ersatzdatei). Darum bleibt die Freigabe, obwohl sie dort Zugriff auf den ganzen Schluesselbund gibt.
  - --talk-name=org.freedesktop.secrets
  # Mitteilungen (Push) bei geschlossener App: UnifiedPush-Verteiler auf dem Sitzungs-Bus (z. B. KUnifiedPush)
  - --talk-name=org.unifiedpush.Distributor.*
  # Klingelton bei eingehenden Anrufen (2.1; nur Wiedergabe - das Gespraech selbst laeuft im Browser, kein Mikrofon hier)
  - --socket=pulseaudio
  # Kein Dateisystem-Zugriff: Anhaenge speichern, Bild waehlen, Anhaengen und Exportieren laufen ueber Gtk.FileDialog (Portal)
# Uebersetzungen bleiben in der App (/app/share/locale): ein Locale-Erweiterungspaket fehlte sonst im Einzeldatei-Bundle
separate-locales: false
cleanup:
  - '*.pyi'
modules:
  # Pillow (Bilder umwandeln/skalieren) als fertiges Wheel von PyPI
  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps pillow
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/f7/62/de5bdd77d935331f4f802edc11e4d82950f642caad6cb2f949837b8560e2/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 0847a763afefb695bc912d7c131e7e0632d4edc1d8698f58ddabec8e46b8b6d3
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/1f/01/e18aff37cb0b4aac47ac90f016d347a49aca667ef97f190b06ac2aabc928/pillow-12.3.0-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: f7401aebd7f581d7f83a439d87d474999317ee099218e5ad25d125290990ba65

  # Chat-Verschluesselung (libsodium): PyNaCl 1.6.x mit cffi als fertige Wheels von PyPI
  - name: python3-pynacl
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps cffi pynacl
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/98/df/0a1755e750013a2081e863e7cd37e0cdd02664372c754e5560099eb7aa44/cffi-2.0.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: c8d3b5532fc71b7a77c09192b4a5a200ea992702734a2e9279a37f2478236f26
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/a9/f5/a2c23eb03b61a0b8747f211eb716446c826ad66818ddc7810cc2cc19b3f2/cffi-2.0.0-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
        sha256: d48a880098c96020b02d5a1f7d9251308510ce8858940e6fa99ece33f610838b
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/7f/81/d60984052df5c97b1d24365bc1e30024379b42c4edcd79d2436b1b9806f2/pynacl-1.6.2-cp38-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 22de65bb9010a725b0dac248f353bb072969c94fa8d6b1f34b87d7953cf7bbe4
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/1e/b4/e927e0653ba63b02a4ca5b4d852a8d1d678afbf69b3dbf9c4d0785ac905c/pynacl-1.6.2-cp38-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
        sha256: 8845c0631c0be43abdd865511c41eab235e0be69c81dc66a50911594198679b0

  # Live mitschreiben (2.5, WS /api/collab): pycrdt 0.14.8 (Yjs-Format, MIT; wie der Server) mit anyio (MIT), idna
  # (BSD-3-Clause), typing_extensions (PSF-2.0) als fertige Wheels von PyPI. Fehlt es, bleibt die App bei Stufe 1.
  - name: python3-pycrdt
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps pycrdt anyio idna typing_extensions
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/d5/e8/92157ef5b99eb66b23decb289e78b0dbe9be42424ecabf32053a8387514d/pycrdt-0.14.8-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        sha256: 6702cee212b5a93501c4d545fc30ece0f6eb5b7d3e5c67c335365f456e4d98d9
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/f4/35/98d6b8cf2b4145abb103a2c68bf3cd68584ec7e0c0e245e994618eb43fc1/pycrdt-0.14.8-cp313-cp313-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
        sha256: 69d186d5737e9dc24b04cc45eaebbaf4765d258fbca49866595d829da8131864
      - type: file
        url: https://files.pythonhosted.org/packages/a9/16/7757fb84c819accc7d7e9af5291b261e4abb8627ee040f99e7d35ef2457a/anyio-4.16.0-py3-none-any.whl
        sha256: c66ae634e0b8228396b801741beb3294326d4b6102f7bba4041c0dfb58c29026
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/49/d3/b8441a820a491ddfc024b0b0cf0393375b75ea13866d9c66727e54c2fc80/typing_extensions-4.16.0-py3-none-any.whl
        sha256: 481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8

  - name: saga
    buildsystem: simple
    build-commands:
      # angezeigte Version (z. B. 2.2.0-rc.3) und Metainfo-Eintrag fuer Vorabversionen - .version-stamp schreibt build-flatpak.sh
      - sh stamp-version.sh . $(cat .version-stamp 2>/dev/null || true)
      - install -d ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf
      - cp -a hlidskjalf/*.py hlidskjalf/style.css ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf/
      # eigene Symbole (z. B. saga-globe-symbolic): App-eigener Suchpfad, siehe main.py
      #   als Thema "hicolor" abgelegt: nur so behandelt GTK sie als symbolisch und faerbt sie ein (Dunkelmodus)
      - install -Dm644 -t ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf/icons/hicolor/scalable/actions hlidskjalf/icons/hicolor/scalable/actions/*.svg
      # Testmodus (HK_TEST) gehoert nicht ins Paket
      - rm -f ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf/testing.py
      - python3 -m compileall -q -d /app/share/hlidskjalf/hlidskjalf ${FLATPAK_DEST}/share/hlidskjalf/hlidskjalf
      # Uebersetzungen: po/*.po -> /app/share/locale/<sprache>/LC_MESSAGES/io.github.yggdrasil_sh.Saga.mo (msgfmt aus dem SDK)
      - sh po/build-mo.sh ${FLATPAK_DEST}/share/locale
      - install -Dm755 flatpak/saga ${FLATPAK_DEST}/bin/saga
      # Befehl heisst im Flatpak "saga" (im RPM "hlidskjalf")
      - sed -e 's/^Exec=hlidskjalf/Exec=saga/' data/${FLATPAK_ID}.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # GNOME-Suche: D-Bus-Dienst (Exec wird beim Export auf "flatpak run" umgeschrieben)
      - install -Dm644 data/${FLATPAK_ID}.SearchProvider.ini ${FLATPAK_DEST}/share/gnome-shell/search-providers/${FLATPAK_ID}.SearchProvider.ini
      - sed -e 's|^Exec=.*|Exec=/app/bin/saga --search-provider|' data/${FLATPAK_ID}.SearchProvider.service > ${FLATPAK_ID}.SearchProvider.service
      - install -Dm644 ${FLATPAK_ID}.SearchProvider.service ${FLATPAK_DEST}/share/dbus-1/services/${FLATPAK_ID}.SearchProvider.service
      # Mitteilungen (UnifiedPush): D-Bus-Aktivierung der App ohne Fenster
      - sed -e 's|^Exec=.*|Exec=/app/bin/saga --gapplication-service|' data/${FLATPAK_ID}.service > ${FLATPAK_ID}.service
      - install -Dm644 ${FLATPAK_ID}.service ${FLATPAK_DEST}/share/dbus-1/services/${FLATPAK_ID}.service
    sources:
      - type: dir
        path: ..
        skip:
          - dist
          - tests
          - .flatpak-builder
          - build-rpm.sh
          - hlidskjalf.spec
          - hlidskjalf/_buildinfo.py
          - README.md
