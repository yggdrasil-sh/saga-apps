name: Hlidskjalf
options:
  developmentLanguage: en          # Rueckfall fuer unbekannte Systemsprachen; Texte: Shared/Localizable.xcstrings (de, en, es)
                                   # Siri-Saetze: App/AppShortcuts.xcstrings, Info.plist-Texte: App/InfoPlist.xcstrings
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
# App-ID, App-Gruppe und Team kommen aus Config/Base.xcconfig (+ optional Config/Local.xcconfig, nicht versioniert)
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
# Chat-Kryptografie (Saga 2.0): libsodium ueber swift-sodium (nur das C-Modul Clibsodium), Version fest
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.9.1
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES                    # Texte aus dem Code fuer die String Catalogs (Xcode gleicht beim Bauen ab)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Hlidskjalf:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        CFBundleName: Saga                                   # Menueleiste/Dock/Finder auf dem Mac
        CFBundleSpokenName: Saga                       # fuer VoiceOver/Siri lesbar
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false                 # nur HTTPS/System-Krypto -> keine Exportfrage bei jedem TestFlight-Build
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSCameraUsageDescription: Take photos for notes and scan QR codes to sign in      # uebersetzt: App/InfoPlist.xcstrings
        NSPhotoLibraryAddUsageDescription: Save images from notes
        CFBundleURLTypes:
          - CFBundleURLName: $(SAGA_BUNDLE_ID)
            CFBundleURLSchemes: [hlidskjalf, saga]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/App-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/App-macOS$(SAGA_MAC_PUSH_SUFFIX).entitlements   # Mitteilungen am Mac: Config/Base.xcconfig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor     # Gold wie Web/Android (Assets.xcassets)
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: Sodium
        product: Clibsodium
      - target: HlidskjalfWidget
      - target: HlidskjalfShare
        destinationFilters: [iOS]
      - target: HlidskjalfShareMac
        destinationFilters: [macOS]
  HlidskjalfWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources: [Widget, Shared/AppConfig.swift, Shared/Keychain.swift, Shared/API.swift, Shared/ColorHex.swift, Shared/DBQuery.swift, Shared/Localizable.xcstrings]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/Widget-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Widget/Widget-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  HlidskjalfShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared/AppConfig.swift, Shared/Keychain.swift, Shared/API.swift, Shared/ShareView.swift, Shared/Localizable.xcstrings]
    info:
      path: Share/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
  HlidskjalfShareMac:
    type: app-extension
    platform: macOS
    sources: [ShareMac, Shared/AppConfig.swift, Shared/Keychain.swift, Shared/API.swift, Shared/ShareView.swift, Shared/Localizable.xcstrings]
    info:
      path: ShareMac/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).sharemac
        CODE_SIGN_ENTITLEMENTS: ShareMac/ShareMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
