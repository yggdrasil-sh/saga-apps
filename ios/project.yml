name: Hlidskjalf
options:
  developmentLanguage: en          # Rueckfall fuer unbekannte Systemsprachen; Texte: Shared/Localizable.xcstrings (de, en, es, th, ru)
                                   # Siri-Saetze: App/AppShortcuts.xcstrings, Info.plist-Texte: App/InfoPlist.xcstrings
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  # Angezeigte Version + Build-Nummer bei jedem Erzeugen frisch setzen (Config/Version.xcconfig, nicht versioniert)
  preGenCommand: sh ../tools/version-label.sh --xcconfig Config/Version.xcconfig
# App-ID, App-Gruppe und Team kommen aus Config/Base.xcconfig (+ optional Config/Local.xcconfig, nicht versioniert)
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
# Chat-Kryptografie (Saga 2.0): libsodium ueber swift-sodium (nur das C-Modul Clibsodium), Version fest
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.9.1
  # Anrufe: vorgebautes libwebrtc (BSD) fuer iOS + macOS, Version fest (Lizenzhinweis in "Ueber").
  # Saga 2.5: webrtc-sdk (LiveKit-Zweig) statt stasel - bringt FrameCryptor mit HKDF (saga-horn/v1, docs/HORN-E2E.md).
  # Modul/Produkt heissen weiter WebRTC, Klassen ohne Praefix. Eingebunden ueber die Huelle Packages/WebRTC (Version und
  # Pruefsumme dort; das Specs-Manifest selbst laesst sich mit Xcode 27 nicht laden).
  WebRTC:
    path: Packages/WebRTC
  # Selbst-Update der Mac-App (nur macOS, aktiv nur in DMG-Builds: build-dmg.sh, App/AppUpdater.swift), Version fest
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.10.0
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.5.0"
    # CURRENT_PROJECT_VERSION (Build-Nummer) und SAGA_VERSION_LABEL ("2.2.0-rc.N"): Config/Base.xcconfig + Config/Version.xcconfig
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES                    # Texte aus dem Code fuer die String Catalogs (Xcode gleicht beim Bauen ab)
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  # 2.5 P3: nur noch iPhone/iPad - der Mac-Teil (SwiftUI) ist eingefroren (Code bleibt, wird nicht gebaut/ausgeliefert);
  # die Mac-App ist die Desktop-Huelle SagaShell (unten). Wieder aufnehmen: macOS in supportedDestinations und die
  # macOS-Abhaengigkeiten (Sparkle, HlidskjalfShareMac) zurueck, SAGA_SHELL_BUNDLE_ID auf eine eigene ID.
  Hlidskjalf:
    type: application
    supportedDestinations: [iOS]
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        SagaVersionLabel: "$(SAGA_VERSION_LABEL)"          # angezeigte Version, z. B. 2.2.0-rc.3 (Store.appVersionLabel)
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        CFBundleName: Saga                                   # Menueleiste/Dock/Finder auf dem Mac
        CFBundleSpokenName: Saga                       # fuer VoiceOver/Siri lesbar
        CFBundleLocalizations: [de, en, es, th, ru]                 # Sprachen der App (Einstellungen-App -> Saga -> Sprache)
        UIPrefersShowingLanguageSettings: true               # Sprachwahl je App auf iOS/iPadOS immer anzeigen
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false                 # nur HTTPS/System-Krypto -> keine Exportfrage bei jedem TestFlight-Build
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSCameraUsageDescription: Take photos for notes, scan QR codes to sign in and make video calls      # uebersetzt: App/InfoPlist.xcstrings
        NSMicrophoneUsageDescription: Talk in audio and video calls and record voice messages   # 2.5: auch Sprachnachrichten
        UIBackgroundModes: [voip, audio, remote-notification]   # Anrufe: PushKit/CallKit, Ton im Hintergrund (nur iOS)
        NSPhotoLibraryAddUsageDescription: Save images and videos from notes and chats
        CFBundleURLTypes:
          - CFBundleURLName: $(SAGA_BUNDLE_ID)
            CFBundleURLSchemes: [hlidskjalf, saga]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/App-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/App-macOS$(SAGA_MAC_PUSH_SUFFIX).entitlements   # Mitteilungen am Mac: Config/Base.xcconfig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor     # Gold wie Web/Android (Assets.xcassets)
        ENABLE_HARDENED_RUNTIME: YES
        # WebRTC.framework liegt am Mac in Contents/Frameworks (Vorgabe des Mehrplattform-Ziels ist die iOS-Struktur)
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: Sodium
        product: Clibsodium
      - package: WebRTC
        product: WebRTC
      - target: HlidskjalfWidget
      - target: HlidskjalfShare
        destinationFilters: [iOS]
      - target: HlidskjalfBroadcast                       # 2.4: Bildschirm teilen (ReplayKit), nur iPhone/iPad
        destinationFilters: [iOS]
  HlidskjalfWidget:
    type: app-extension
    supportedDestinations: [iOS]                         # Mac: SagaShellWidget (gleiche Quellen)
    sources: [Widget, Shared/AppConfig.swift, Shared/PrivateNet.swift, Shared/Keychain.swift, Shared/API.swift, Shared/TaskSourceLogic.swift, Shared/ColorHex.swift, Shared/DBQuery.swift, Shared/DBDates.swift, Shared/DateFormats.swift, Shared/Localizable.xcstrings]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widget/Widget-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Widget/Widget-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  HlidskjalfShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared/AppConfig.swift, Shared/PrivateNet.swift, Shared/Keychain.swift, Shared/API.swift, Shared/TaskSourceLogic.swift, Shared/ShareView.swift, Shared/ShareBookmarkLogic.swift, Shared/DateFormats.swift, Shared/Localizable.xcstrings]
    info:
      path: Share/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Share/Share.entitlements
  # 2.4 E3: Bildschirm teilen auf iPhone/iPad. Bilder gehen ueber einen Unix-Socket im Container der App-Gruppe an die
  # App (Shared/ScreenFrame.swift); keine WebRTC-Bibliothek in der Erweiterung (Speichergrenze ca. 50 MB).
  # Signierung: eigene App-ID $(SAGA_BUNDLE_ID).broadcast mit derselben App-Gruppe (build-adhoc.sh/-testflight.sh legen
  # sie mit -allowProvisioningUpdates automatisch an, siehe ios/README.md)
  HlidskjalfBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared/ScreenFrame.swift, Shared/ScreenSocket.swift, Shared/Localizable.xcstrings]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # Socket im Container der App-Gruppe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
  # Eingefroren seit P3 (gehoerte zur nativen Mac-App, keine Abhaengigkeit mehr) - die Huelle nutzt SagaShellShareMac
  HlidskjalfShareMac:
    type: app-extension
    platform: macOS
    sources: [ShareMac, Shared/AppConfig.swift, Shared/PrivateNet.swift, Shared/Keychain.swift, Shared/API.swift, Shared/TaskSourceLogic.swift, Shared/ShareView.swift, Shared/ShareBookmarkLogic.swift, Shared/DateFormats.swift, Shared/Localizable.xcstrings]
    info:
      path: ShareMac/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Saga
        SagaAppGroup: $(SAGA_APP_GROUP)                    # gelesen von AppConfig.appGroup
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)          # gemeinsamer Schluesselbund (App-Schluessel)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).sharemac
        CODE_SIGN_ENTITLEMENTS: ShareMac/ShareMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # 2.5 Desktop-Huelle P2 (docs/APP-API-HOST.md im Server-Repo): die Web-Oberflaeche
  # in einem WKWebView, dazu Anmeldung mit Geraete-Schluessel, Dock-Zahl, Widgets anstossen, Systembrowser, Deep-Links,
  # Downloads, Offline-Seite. Etappe 2: Widget- und Teilen-Erweiterung (SagaShellWidget, SagaShellShareMac: gleicher
  # Code wie HlidskjalfWidget/HlidskjalfShareMac, App-ID und App-Gruppe der Huelle), APNs (Shell/Shell-push.entitlements
  # ueber SAGA_MAC_PUSH_SUFFIX), Menueleisten-Erfassung, Spotlight, Sparkle, QR-Kopplung, saga://new nativ.
  # Seit P3 die Mac-App: gleiche App-ID/Gruppe/Link-Schemata wie die bisherige Mac-App (Config/Base.xcconfig, SAGA_SHELL_*).
  # Shell/offline.html = Kopie von static/offline.html (Server).
  # xcodebuild -scheme SagaShell -destination 'generic/platform=macOS' build
  SagaShell:
    type: application
    platform: macOS
    sources:
      - Shell
      - Shared/AppConfig.swift
      - Shared/PrivateNet.swift
      - Shared/Keychain.swift
      - Shared/API.swift                                   # Etappe 2: Erfassung, Spotlight, neuer Datenbank-Eintrag (App-Schluessel)
      - Shared/TaskSourceLogic.swift
      - Shared/DateFormats.swift
      - App/UpdateLogic.swift                              # Sparkle nur, wenn das Bauskript den Appcast eintraegt
      - App/Assets.xcassets
    info:
      path: Shell/Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        SagaVersionLabel: "$(SAGA_VERSION_LABEL)"
        CFBundleDisplayName: $(SAGA_SHELL_NAME)
        CFBundleName: $(SAGA_SHELL_NAME)
        SagaAppGroup: $(SAGA_SHELL_APP_GROUP)
        SagaKeychainGroup: $(SAGA_SHELL_APP_GROUP)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        CFBundleLocalizations: [de, en, es, th, ru]
        LSApplicationCategoryType: public.app-category.productivity
        NSCameraUsageDescription: Make video calls and take photos for notes                 # uebersetzt: Shell/InfoPlist.xcstrings
        NSMicrophoneUsageDescription: Talk in audio and video calls and record voice messages
        NSLocalNetworkUsageDescription: Calls connect directly to devices in your network when possible
        CFBundleURLTypes:
          - CFBundleURLName: $(SAGA_SHELL_BUNDLE_ID)
            CFBundleURLSchemes: [$(SAGA_SHELL_URL_SCHEME), $(SAGA_SHELL_URL_SCHEME_ALT)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_SHELL_BUNDLE_ID)
        PRODUCT_NAME: Saga                                   # Saga.app (ersetzt die bisherige Mac-App)
        CODE_SIGN_ENTITLEMENTS: Shell/Shell$(SAGA_MAC_PUSH_SUFFIX).entitlements    # Mitteilungen: Config/Base.xcconfig
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Sparkle
        product: Sparkle
      - target: SagaShellWidget
      - target: SagaShellShareMac
  # Etappe 2: Erweiterungen der Huelle - Quellen wie HlidskjalfWidget/HlidskjalfShareMac, App-ID unter der Huelle,
  # App-Gruppe SAGA_APP_GROUP (seit P3 dieselbe wie die der Huelle; die Entitlements lesen die Variable).
  # Links aus dem Widget nutzen das Schema der Huelle (SagaLinkScheme). Seit P3 ist SAGA_SHELL_BUNDLE_ID = $(SAGA_BUNDLE_ID):
  # dieselben IDs wie bisher die Erweiterungen der Mac-App (vorhandene Widgets auf dem Schreibtisch bleiben).
  SagaShellWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared/AppConfig.swift, Shared/PrivateNet.swift, Shared/Keychain.swift, Shared/API.swift, Shared/TaskSourceLogic.swift, Shared/ColorHex.swift, Shared/DBQuery.swift, Shared/DBDates.swift, Shared/DateFormats.swift, Shared/Localizable.xcstrings]
    info:
      path: Shell/Widget-Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: $(SAGA_SHELL_NAME)
        SagaAppGroup: $(SAGA_APP_GROUP)
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        SagaLinkScheme: $(SAGA_SHELL_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_SHELL_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: Widget/Widget-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  SagaShellShareMac:
    type: app-extension
    platform: macOS
    sources: [ShareMac, Shared/AppConfig.swift, Shared/PrivateNet.swift, Shared/Keychain.swift, Shared/API.swift, Shared/TaskSourceLogic.swift, Shared/ShareView.swift, Shared/ShareBookmarkLogic.swift, Shared/DateFormats.swift, Shared/Localizable.xcstrings]
    info:
      path: Shell/ShareMac-Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: $(SAGA_SHELL_NAME)
        SagaAppGroup: $(SAGA_APP_GROUP)
        SagaKeychainGroup: $(SAGA_KEYCHAIN_GROUP)
        SagaDefaultServer: $(SAGA_DEFAULT_SERVER)
        SagaMovedServers: $(SAGA_MOVED_SERVERS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_SHELL_BUNDLE_ID).sharemac
        CODE_SIGN_ENTITLEMENTS: ShareMac/ShareMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # 2.5 Chat-Stufe 3 + Grundlagen: Vektoren tests/vectors/chat_v3.json (Kopie in Tests/vectors), Ogg-Muxer/-Demuxer,
  # Opus-Codec des Systems (nur synthetischer Eingang: Sinus bzw. Tests/vectors/voice_sine.ogg), Wellenform,
  # Vertrauens-Uebernahme. Ohne Host-App, ohne Netz - nie Mikrofon, keine AVAudioEngine, kein Audio-Geraet.
  # xcodebuild -scheme ChatX3Tests -destination 'platform=macOS' test  (bzw. eine iOS-Simulator-ID)
  ChatX3Tests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/ChatX3
      - App/AILogic.swift
      - App/CallLogic.swift
      - App/ChatCrypto.swift
      - App/ChatCryptoV2.swift
      - App/ChatCryptoV3.swift
      - App/ChatLogic.swift
      - App/ChatMediaLogic.swift
      - App/ChatX3Logic.swift
      - App/FedChatLogic.swift
      - App/FedChatFlow.swift
      - App/FileV2Logic.swift
      - App/LanguageLogic.swift
      - App/ShareLogic.swift
      - App/VoiceOgg.swift
      - App/VoiceCodec.swift
      - path: Tests/vectors/chat_v3.json
        buildPhase: resources
      - path: Tests/vectors/voice_sine.ogg
        buildPhase: resources
    dependencies:
      - package: Sodium
        product: Clibsodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).chatx3tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  # 2.5 Gjallarhorn: Frame-E2E saga-horn/v1 gegen tests/vectors/horn_e2e.json (Kopie in Tests/vectors) und FrameCryptor
  # im Loopback. Ohne Host-App (kein Fenster), Testbild aus dem Speicher, stilles Audio-Geraet - nie Kamera/Mikrofon.
  # Dazu (P11 Stufe 2) die Entscheidungen wie tests/horn_logik.js und ein Integrationstest gegen einen lokalen Knoten
  # (nur mit TEST_RUNNER_SAGA_HORN_NODE=https://127.0.0.1:<port>, sonst uebersprungen).
  # xcodebuild -scheme HornE2ETests -destination 'platform=macOS' test  (bzw. eine iOS-Simulator-ID)
  HornE2ETests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - Tests/Horn
      - App/HornE2E.swift
      - App/HornCryptor.swift
      - App/HornLogic.swift                                # 2.5 P11 Stufe 2: Kandidaten, Umschalter, Kacheln, Schluesselplan
      - App/HornNode.swift                                 # Gespraech mit dem Knoten (Messung, Bein, Ereigniskanal)
      - App/HornMedia.swift                                # Bein = PeerConnection mit FrameCryptor
      - App/HornCamPlan.swift                              # Kamera-Schichten (gleiche Werte je Schicht)
      - Shared/ScreenFrame.swift                           # Bildschirm: Groesse/Bildrate der Erweiterung (Knotentest)
      - App/ScreenSink.swift                               # Bildschirm: Empfaenger vor der Quelle (Wiederholung)
      - path: Tests/vectors/horn_e2e.json
        buildPhase: resources
    dependencies:
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAGA_BUNDLE_ID).horntests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @loader_path/../Frameworks"
